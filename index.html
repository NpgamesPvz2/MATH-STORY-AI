    <script>
      // Gracefully prevent benign Vite/browser WebSocket closed without opened logs in sandbox iframe
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.includes('websocket') || msg.includes('ws://') || msg.includes('wss://')) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)).toLowerCase() : '';
        if (reason.includes('websocket') || reason.includes('ws://') || reason.includes('wss://')) {
          e.preventDefault();
        }
      });
    </script>
